group: shape
name: shape_recon
load: 

batch_size: 120
debug: false
profile: false
image_size: [224,224]
gpu: 0
max_epoch: 30
output_root: output
resume: false
seed: 0
yaml:

pretrain:
    depth: weights/depth.ckpt

arch:
    # general
    num_heads: 8
    latent_dim: 1024 #256 #384 #256 #384
    win_size: 14
    # depth
    depth:
        encoder: resnet #pointtr
        n_blocks: 12
        dsp: 2
        pretrained: model/depth/pretrained_weights/omnidata_dpt_depth_v2.ckpt
    # rgb
    rgb:
        encoder: 
        n_blocks: 12 
    # implicit
    impl:
        n_channels: 256
        # attention-related
        att_blocks: 2
        mlp_ratio: 4.
        posenc_perlayer: false
        # mlp-related
        mlp_layers: 8
        posenc_3D: 0
        skip_in: [2,4,6]

eval:
    batch_size: 800
    brute_force: false
    n_vis: 4
    vox_res: 64
    num_points: 10000
    range: [-1.5,1.5]
    icp: false
    f_thresholds: [0.005, 0.01, 0.02, 0.05, 0.1, 0.2]
    # flip: false
    flip_mesh: false
    flip_with_gt: false
    save_raw_symm_only: false
    save_refined_only: false
    also_save_raw_symm: false
    eval_how_symm_is_shape: false

data:
    num_classes_test: 15
    max_img_cat: 
    dataset_train: synthetic
    dataset_test: synthetic
    num_workers: 6
    bgcolor: 1
    pix3d:                       
        cat: 
    ocrtoc:                       
        cat: 
        erode_mask: 
    synthetic:        
        subset: objaverse_LVIS,ShapeNet55
        percentage: 1
    train_sub:
    val_sub:

training:
    n_sdf_points: 4096
    shape_loss:
        impt_weight: 1
        impt_thres: 0.01
    depth_loss:
        grad_reg: 0.1
        depth_inv: true
        mask_shrink: false

loss_weight:
    shape: 
    depth: 
    intr: 
    symm_cls: 5
    symm_normal: 0.5
    symm_offset: 0.0
    alignment1: 
    alignment2: 
    alignment3: 
    symmshape: 

    
optim:
    lr: 9.e-5 #3.e-5
    lr_ft: 3.e-5 #1.e-5
    weight_decay: 0.05
    fix_dpt: false
    fix_clip: true
    clip_norm: 
    amp: false
    accum: 1
    sched: false
    freeze_dino: true
    use_vit: false

tb:
    num_images: [4,8]

freq:
    print: 1 #200
    print_eval: 1 #100
    scalar: 100 # iterations
    vis: 1000 # iterations
    save_vis: 1000
    ckpt_latest: 1000 # iterations
    eval: 1


pointtr:
    encoder_config:
        embed_dim: 384
        depth: 6
        num_heads: 6
        k: 8
        n_group: 2
        mlp_ratio: 2.
        block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn']
        combine_style: 'concat'

symm_decoder:
    dim: 256
    num_layers: 4
    num_head: 4
    ffn_dim: 256
    dropout: 0.1

symm:
    num_queries: 31

